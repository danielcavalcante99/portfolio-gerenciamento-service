spring:
  application:
    name: management

  profiles:
    default: ${ACTIVE_PROFILE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_dev}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  flyway:
    enabled: true

  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin123}

server:
  port: ${SERVER_PORT:8080}

portfolio:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  projeto:
    max-membros: ${MAX_MEMBROS_PROJETO:10}
    max-alocacoes-ativas: ${MAX_ALOCACOES_ATIVAS:3}
    limite-orcamento-baixo: ${LIMITE_ORCAMENTO_BAIXO:100000.00}
    limite-orcamento-alto: ${LIMITE_ORCAMENTO_ALTO:500000.00}
