spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 600000
      leak-detection-threshold: 30000

  devtools:
    restart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.portfolio.gerenciamento: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN