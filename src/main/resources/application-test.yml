spring:
  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  flyway:
    enabled: true

  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      idle-timeout: 60000
      max-lifetime: 900000
      leak-detection-threshold: 30000

  devtools:
    restart:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: WARN
    com.portfolio.gerenciamento: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
